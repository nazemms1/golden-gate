name: Deploy to GitHub Pages

# Pages on this repo is configured as "Deploy from a branch: gh-pages", which
# is what pushing that branch set up automatically. So this builds and force
# pushes dist/ there, rather than using actions/deploy-pages — that action
# needs the source set to "GitHub Actions" and 404s against a branch source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Prepare the published tree
        run: |
          # Single-page site: serving index.html as 404 keeps refreshes and
          # deep links working. .nojekyll stops Pages from filtering files.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages
        working-directory: dist
        run: |
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ${GITHUB_SHA::7}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
